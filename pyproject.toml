[project]
name = "transcribe"
version = "0.1.0"
description = "Hosted transcription, diarization, forced alignment, and cleanup pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "pydantic>=2.0",
]

# whisperx is deliberately absent: it pins torch and declares
# `requires-python <3.14`, so it is installed on demand into an isolated
# Python 3.12 environment by workers/align_worker.py.

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
